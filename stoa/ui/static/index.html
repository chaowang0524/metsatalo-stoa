<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoa Plan Check</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">Stoa <span>Plan Check</span></div>
  <div id="search" role="combobox" aria-expanded="false" aria-haspopup="listbox">
    <input id="search-input" type="search" placeholder="Search drawings  ( / )" autocomplete="off" spellcheck="false"
      aria-label="Search drawings by file name" aria-controls="search-results">
    <ul id="search-results" role="listbox" hidden></ul>
  </div>
  <select id="picker" aria-label="Drawing"></select>
  <div class="actions">
    <button id="btn-upload" class="tool" title="Upload floor plans (one or many): PNG/JPG, PDF, DXF, IFC + plan SVG">⤒ Upload</button>
    <input id="upload-input" type="file" multiple hidden
      accept=".png,.jpg,.jpeg,.webp,.bmp,.tif,.tiff,.pdf,.dxf,.svg,.ifc">
    <button id="btn-export" class="tool" title="Save the edited plan as PNG, JPEG or PDF" aria-haspopup="menu">⤓ Export</button>
    <button id="btn-render" class="tool" title="AI 3D render of the edited plan">◈ 3D</button>
  </div>
</header>

<main>
  <section id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg">
      <image id="bg" preserveAspectRatio="none"/>
      <g id="layer-edits"></g>
      <g id="layer-hl"></g>
      <g id="layer-sel"></g>
    </svg>
    <div id="palette">
      <span id="palette-hint" class="hint"></span>
      <div id="palette-kinds"></div>
      <div id="lib-pop" role="dialog" aria-label="Symbol library" hidden></div>
      <button id="btn-undo" class="small" title="Undo (⌘Z)" hidden>↶ Undo</button>
    </div>
    <button id="nav-prev" class="nav prev" aria-label="Previous drawing" title="Previous drawing (←)">‹</button>
    <button id="nav-next" class="nav next" aria-label="Next drawing" title="Next drawing (→)">›</button>
    <div class="zoom">
      <button id="z-in" aria-label="Zoom in">+</button>
      <button id="z-out" aria-label="Zoom out">−</button>
      <button id="z-fit" aria-label="Fit">⤢</button>
    </div>
    <div id="credit"></div>
  </section>

  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the plan and the side panel"
    tabindex="0" title="Drag to resize · double-click to reset"></div>
  <aside id="panel">
    <div class="doc-head">
      <h1 id="doc-title"></h1>
      <div id="doc-meta"></div>
    </div>
    <div id="tabs" role="tablist" aria-label="Side panel">
      <button id="tab-facts" role="tab" aria-selected="true" aria-controls="facts">Facts</button>
      <button id="tab-cost" role="tab" aria-selected="false" aria-controls="cost-pane" title="Installed cost of the components on this plan">€ Cost</button>
    </div>
    <div id="facts" role="tabpanel" aria-labelledby="tab-facts"></div>
    <div id="cost-pane" role="tabpanel" aria-labelledby="tab-cost"></div>

    <div id="ask">
      <div id="thread"></div>
      <form id="ask-form" hidden>
        <input id="ask-input" placeholder="Ask about this drawing, any language" autocomplete="off">
        <button type="submit">Ask</button>
      </form>
      <button id="btn-ask" class="ask-open">💬 Ask a question</button>
    </div>
  </aside>
</main>

<dialog id="render-dlg">
  <form method="dialog" class="dlg-head">
    <strong>3D render</strong>
    <button aria-label="Close">✕</button>
  </form>
  <div class="styles">
    <label><input type="radio" name="style" value="isometric" checked> Isometric</label>
    <label><input type="radio" name="style" value="photoreal"> Photoreal</label>
    <label><input type="radio" name="style" value="massing"> Massing</label>
    <button id="btn-generate">Generate</button>
  </div>
  <div id="render-out"><p class="muted">Renders the plan as you edited it. AI illustration only: use the plan for counts and measurements.</p></div>
  <div class="dlg-foot"><button id="btn-share-3d" disabled aria-haspopup="menu">↗ Share render</button></div>
</dialog>

<dialog id="submit-dlg">
  <form method="dialog" class="dlg-head">
    <strong>Submit cost estimate</strong>
    <button aria-label="Close">✕</button>
  </form>
  <form id="submit-form" class="submit-body">
    <fieldset class="to">
      <legend>Send to</legend>
      <label><input type="radio" name="to" value="approval" checked> Internal approval <small>site manager / cost control</small></label>
      <label><input type="radio" name="to" value="client"> Client <small>as an offer</small></label>
    </fieldset>
    <label>Prepared by <input name="by" required autocomplete="name" placeholder="Your name"></label>
    <label>Note for the reviewer <textarea name="note" rows="3" placeholder="e.g. 2 windows added on site, bathtub price from supplier quote"></textarea></label>
    <div id="submit-checks"></div>
    <div class="dlg-foot"><button type="submit" class="primary">Submit</button></div>
  </form>
</dialog>

<div id="drop" hidden><div>Drop drawings to upload<small>PNG / JPG plans, PDF, DXF (+ its PDF), IFC + plan SVG</small></div></div>
<div id="toast" role="status"></div>
<script src="/static/app.js"></script>
</body>
</html>
